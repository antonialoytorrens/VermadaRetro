# Project identification
sonar.projectKey=VermadaRetro
sonar.projectName=VermadaRetro
sonar.projectVersion=1.0.1

# Source code
sonar.sources=src
sonar.sourceEncoding=UTF-8
sonar.language=c

# Exclusions (optional)
sonar.exclusions=**/test/**,**/tests/**
sonar.cxx.clangtidy.reportPaths=report/clang-tidy-report.txt
sonar.cxx.compiler.reportPaths=report/compiler-warnings.txt
sonar.cxx.compiler.parser=GCC
sonar.cxx.compiler.regex=^(.*):(\\d+):(\\d+):\\x20warning:\\x20(.*)\\[(.*)\\]$
sonar.cxx.compiler.reportPath=report/compiler-warnings.txt

# include-what-you-use
sonar.cxx.other.reportPaths=report/iwyu-report.txt

# cpplint - Google's style checker
sonar.cxx.other.reportPaths=report/cpplint-report.txt,report/iwyu-report.txt

# Dr. Memory - Memory debugger
#sonar.cxx.drmemory.reportPaths=report/drmemory-report.txt

# Valgrind - Memory debugger
sonar.cxx.valgrind.reportPaths=report/valgrind-report.xml

# Coverage
sonar.cxx.coverage.reportPaths=report/coverage.xml
sonar.cxx.coverage.itReportPaths=report/coverage.xml

# Unit Tests reports
# sonar.cxx.xunit.reportPaths=report/test-results.xml

# Include directories for better analysis
sonar.cxx.includeDirectories=include,src

# Define macros (optional)
# sonar.cxx.defines=VERSION=1.0,DEBUG

# Error recovery mode
sonar.cxx.errorRecoveryEnabled=true

# Force language (if mixed C/C++)
sonar.cxx.file.suffixes=.c,.h

